name: Windows Installer Smoke

# Run the native PowerShell installer contract suite under both supported
# Windows hosts. The suite's local-artifact dry-run and source assertions are
# deterministic; it never publishes a release or performs a real install.

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'install.sh'
      - 'install.ps1'
      - 'scripts/test-install-sh.sh'
      - 'scripts/test-install-sh-hardening.sh'
      - 'scripts/test-install-sh-mirror-bundle.sh'
      - 'scripts/test-install-ps1.ps1'
      - '.github/workflows/windows-installer-smoke.yml'
  pull_request:
    paths:
      - 'install.sh'
      - 'install.ps1'
      - 'scripts/test-install-sh.sh'
      - 'scripts/test-install-sh-hardening.sh'
      - 'scripts/test-install-sh-mirror-bundle.sh'
      - 'scripts/test-install-ps1.ps1'
      - '.github/workflows/windows-installer-smoke.yml'

permissions:
  contents: read

jobs:
  windows-powershell-5-1:
    name: Windows PowerShell 5.1 (Desktop)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report host edition
        shell: powershell
        run: |
          "$($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion)"

      - name: Run installer contract suite (Windows PowerShell 5.1)
        shell: powershell
        run: .\scripts\test-install-ps1.ps1

  powershell-7:
    name: PowerShell 7 (Core)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report host edition
        shell: pwsh
        run: |
          "$($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion)"

      - name: Run installer contract suite (PowerShell 7)
        shell: pwsh
        run: ./scripts/test-install-ps1.ps1
