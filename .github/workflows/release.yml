name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  source-release:
    runs-on: ubuntu-latest
    outputs:
      source_asset: ${{ steps.archive.outputs.source_asset }}
      checksum_asset: ${{ steps.archive.outputs.checksum_asset }}
      source_sha: ${{ steps.archive.outputs.source_sha }}
    steps:
      - name: Checkout peeled release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Create deterministic TUI source archive
        id: archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::TAG '$TAG' is not an exact vX.Y.Z release tag" >&2
            exit 1
          fi
          commit="$(git rev-parse "$TAG^{commit}")"
          test "$commit" = "$(git rev-parse "$TAG^{}")"
          test "$commit" = "$(git rev-parse HEAD)"
          source_asset="lingtai-${TAG}-source.tar.gz"
          checksum_asset="${source_asset}.sha256"
          git archive --format=tar --prefix="lingtai-${TAG}/" "$commit" | gzip -n > "$source_asset"
          sha256sum "$source_asset" > "$checksum_asset"
          test -s "$source_asset"
          test "$(sha256sum "$source_asset" | cut -d' ' -f1)" = "$(cut -d' ' -f1 "$checksum_asset")"
          echo "source_asset=$source_asset" >> "$GITHUB_OUTPUT"
          echo "checksum_asset=$checksum_asset" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(cut -d' ' -f1 "$checksum_asset")" >> "$GITHUB_OUTPUT"
          echo "peeled_commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --verify-tag --draft \
              --title "$TAG" --notes "Release $TAG"
          fi

      - name: Publish producer-owned source assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SOURCE_ASSET: ${{ steps.archive.outputs.source_asset }}
          CHECKSUM_ASSET: ${{ steps.archive.outputs.checksum_asset }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" --repo "$REPO" --clobber "$SOURCE_ASSET" "$CHECKSUM_ASSET"
          names="$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')"
          for asset in "$SOURCE_ASSET" "$CHECKSUM_ASSET"; do
            grep -qx "$asset" <<< "$names" || {
              echo "::error::release is missing required source asset $asset" >&2
              exit 1
            }
          done
          gh release edit "$TAG" --repo "$REPO" --draft=false

      - name: Notify lingtai-web of TUI source assets
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.LINGTAI_WEB_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
          SOURCE_ASSET: ${{ steps.archive.outputs.source_asset }}
          CHECKSUM_ASSET: ${{ steps.archive.outputs.checksum_asset }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::warning::LINGTAI_WEB_DISPATCH_TOKEN is not set; skipping mirror metadata notification."
            exit 0
          fi
          python3 - "$TAG" "$SOURCE_ASSET" "$CHECKSUM_ASSET" <<'PY' | gh api repos/Lingtai-AI/lingtai-web/dispatches --method POST --input -
          import hashlib
          import json
          import sys
          from pathlib import Path

          tag, source_name, checksum_name = sys.argv[1:]
          source_path = Path(source_name)
          checksum_path = Path(checksum_name)
          source_sha = hashlib.sha256(source_path.read_bytes()).hexdigest()
          declared_sha = checksum_path.read_text().split()[0]
          if declared_sha != source_sha:
              raise SystemExit(f"checksum sidecar disagrees with source archive: {declared_sha} != {source_sha}")
          assets = []
          for path in (source_path, checksum_path):
              assets.append({"name": path.name, "sha256": hashlib.sha256(path.read_bytes()).hexdigest(), "size": path.stat().st_size})
          print(json.dumps({
              "event_type": "release-asset-published",
              "client_payload": {
                  "source_repo": "Lingtai-AI/lingtai",
                  "tag": tag,
                  "assets": assets,
              },
          }))
          PY

  update-homebrew:
    needs: source-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: Lingtai-AI/homebrew-lingtai
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Read producer source checksum
        id: source
        env:
          SOURCE_ASSET: ${{ needs.source-release.outputs.source_asset }}
          SOURCE_SHA: ${{ needs.source-release.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_ASSET" =~ ^lingtai-v[0-9]+\.[0-9]+\.[0-9]+-source\.tar\.gz$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{64}$ ]]
          echo "asset=$SOURCE_ASSET" >> "$GITHUB_OUTPUT"
          echo "checksum=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Write TUI-only formula
        env:
          TAG: ${{ github.ref_name }}
          SOURCE_ASSET: ${{ steps.source.outputs.asset }}
          SOURCE_SHA: ${{ steps.source.outputs.checksum }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          cat > homebrew-tap/lingtai-tui.rb << FORMULA
          class LingtaiTui < Formula
            desc "Terminal UI for the Lingtai AI agent framework"
            homepage "https://github.com/Lingtai-AI/lingtai"
            version "${VERSION}"
            license "Apache-2.0"

            url "https://github.com/Lingtai-AI/lingtai/releases/download/${TAG}/${SOURCE_ASSET}"
            sha256 "${SOURCE_SHA}"

            depends_on "go" => :build
            depends_on "uv" => :recommended
            depends_on "python@3.13" => :recommended

            def install
              cd "tui" do
                ldflags = "-X main.version=#{version}"
                system "go", "build", "-trimpath", "-ldflags", ldflags, "-o", bin/"lingtai-tui", "."
              end
            end

            test do
              assert_match "lingtai-tui", shell_output("#{bin}/lingtai-tui version 2>&1", 0)
            end
          end
          FORMULA

      - name: Push formula update
        working-directory: homebrew-tap
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lingtai-tui.rb
          git diff --cached --quiet || git commit -m "Update lingtai-tui to $TAG"
          git push
